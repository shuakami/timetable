<!doctype html>
<!-- 小组件选择器里的预览图源文件。用 tools/gen_widget_previews.sh 截成 PNG。 -->
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: transparent; }
  body { font-family: -apple-system, "Noto Sans CJK SC", "PingFang SC", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .card { box-sizing: border-box; border-radius: 24px; background: #fff; padding: 14px; display: flex; flex-direction: column; }
  .head { display: flex; align-items: baseline; gap: 6px; }
  .day { font-size: 30px; line-height: 1; font-weight: 600; letter-spacing: -.03em; color: #16171A; font-variant-numeric: tabular-nums; }
  .wd { font-size: 13px; font-weight: 600; color: #4F5BD5; }
  .sub { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #A2A6AF; }
  .rows { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; align-items: center; gap: 8px; border-radius: 10px; padding: 6px 10px 6px 0; }
  .bar { width: 3px; margin: 3px 0 3px 6px; border-radius: 99px; align-self: stretch; flex: none; }
  .name { font-size: 12px; line-height: 1.3; font-weight: 700; letter-spacing: -.01em; color: #16171A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .loc { margin-top: 1px; font-size: 11px; line-height: 1.25; font-weight: 500; color: #8A8E97; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .time { flex: none; font-size: 11.5px; line-height: 1.3; font-weight: 600; color: #8A8E97; font-variant-numeric: tabular-nums; }
  .grow { min-width: 0; flex: 1; }
  .label { font-size: 11.5px; font-weight: 700; color: #8A8E97; }
  .num { font-size: 38px; line-height: 1; font-weight: 600; letter-spacing: -.035em; color: #16171A; font-variant-numeric: tabular-nums; }
  .unit { font-size: 13px; font-weight: 600; color: #8A8E97; margin-left: 4px; }
  .tm { font-size: 12px; font-weight: 700; color: #A2A6AF; }
  .wk { font-size: 17px; font-weight: 600; letter-spacing: -.02em; color: #16171A; }
  .dt { margin-left: 8px; font-size: 12px; font-weight: 600; color: #A2A6AF; }
  .wds { margin-top: 12px; display: flex; gap: 6px; }
  .wds div { flex: 1; text-align: center; font-size: 11.5px; font-weight: 700; color: #8A8E97; }
  .wds .on { color: #4F5BD5; }
  .grid { margin-top: 8px; display: flex; gap: 6px; }
  .col { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .cell { height: 64px; box-sizing: border-box; border-radius: 10px; padding: 8px 6px; }
  .cell .n { font-size: 11px; line-height: 1.25; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell .t { margin-top: 6px; font-size: 10px; line-height: 1.3; font-weight: 600; color: #8A8E97; font-variant-numeric: tabular-nums; }
  .cell .l { margin-top: 1px; font-size: 10px; line-height: 1.3; font-weight: 500; color: #A2A6AF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<script>
const C = { math: '#4F5BD5', ds: '#3E9C6E', phy: '#D0873A', eng: '#C25B5B', la: '#7A5BD5' }
const tint = (c, p) => `color-mix(in srgb, ${c} ${p}%, #fff)`
const deep = (c) => `color-mix(in srgb, ${c} 88%, #000)`
const row = (name, loc, time, color) => `
  <div class="row" style="background:${tint(color, 8)}">
    <i class="bar" style="background:${color}"></i>
    <div class="grow"><div class="name">${name}</div>${loc ? `<div class="loc">${loc}</div>` : ''}</div>
    ${time ? `<div class="time">${time}</div>` : ''}
  </div>`
const head = (sub) => `<div class="head"><span class="day">14</span><span class="wd">周二</span>${sub ? `<span class="sub">${sub}</span>` : ''}</div>`

const views = {
  today: `<div class="card" style="width:162px;height:162px">
    ${head('还剩 2 节')}
    <div class="rows">${row('高等数学', '教三 302', '10:00', C.math)}${row('数据结构', '教一 201', '14:00', C.ds)}</div>
  </div>`,
  next: `<div class="card" style="width:162px;height:162px">
    <div class="label">下一节</div>
    <div class="head" style="margin-top:4px;gap:0"><span class="num">15</span><span class="unit">分钟后</span></div>
    <div style="margin-top:auto">${row('高等数学（下）', '教三 302　王立群', '', C.math)}</div>
  </div>`,
  twoDays: `<div class="card" style="width:338px;height:162px;flex-direction:row;gap:14px">
    <div class="grow">${head('还剩 2 节')}<div class="rows">${row('高等数学（下）', '', '10:00', C.math)}${row('数据结构', '教一 201', '14:00', C.ds)}</div></div>
    <div class="grow"><div class="tm" style="padding-top:6px">明天 2 节</div><div class="rows">${row('数据结构', '', '10:00', C.ds)}${row('大学物理', '理科楼 A203', '14:00', C.phy)}</div></div>
  </div>`,
  week: (() => {
    const cols = [
      [[C.eng, '大学英语', '08:00', '外语楼 105', false], [C.math, '高等数学', '10:00', '教三 302', false]],
      [[C.eng, '大学英语', '08:00', '外语楼 105', false], [C.math, '高等数学', '10:00', '教三 302', true]],
      [[C.ds, '数据结构', '10:00', '教一 201', false], [C.phy, '大学物理', '14:00', '理科楼 A', false]],
      [[C.math, '高等数学', '08:00', '教三 302', false], [C.la, '线性代数', '14:00', '教三 110', false]],
      [[C.phy, '大学物理', '08:00', '理科楼 A', false], [C.ds, '数据结构', '10:00', '机房 B2', false]],
    ]
    const wd = ['周一', '周二', '周三', '周四', '周五']
    return `<div class="card" style="width:338px;padding:14px 14px 16px">
      <div class="head" style="gap:0"><span class="wk">第 7 周</span><span class="dt">10月14日</span></div>
      <div class="wds">${wd.map((w, i) => `<div class="${i === 1 ? 'on' : ''}">${w}</div>`).join('')}</div>
      <div class="grid">${cols.map((col) => `<div class="col">${col.map(([c, n, t, l, now]) => `
        <div class="cell" style="background:${tint(c, now ? 16 : 8)};${now ? `box-shadow:inset 0 0 0 1.5px ${c}` : ''}">
          <div class="n" style="color:${deep(c)}">${n}</div><div class="t">${t}</div><div class="l">${l}</div>
        </div>`).join('')}</div>`).join('')}</div>
    </div>`
  })(),
}
const which = new URLSearchParams(location.search).get('w') || 'today'
document.body.innerHTML = views[which]
</script>
</body>
</html>
