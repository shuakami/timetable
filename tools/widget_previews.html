<!doctype html>
<!-- 小组件选择器里的预览图源文件。用 tools/gen_widget_previews.sh 截成 PNG。
     ?w=today|next|twoDays|week 单张；?theme=light|dark|black 配色；?sheet=1 四种样式浅深各一份；?sheet=empty 空状态各种情形。 -->
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: transparent; }
  body { font-family: -apple-system, "Noto Sans CJK SC", "PingFang SC", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .t-light { --surface: #fff; --ink: #16171A; --ink3: #8A8E97; --ink4: #A2A6AF; --accent: #4F5BD5; --tint: #fff; --mix: #000; }
  .t-dark { --surface: #1C1D21; --ink: #F1F1EF; --ink3: #8F939C; --ink4: #8F939C; --accent: #7C8FF0; --tint: #26272C; --mix: #fff; }
  .t-black { --surface: #121214; --ink: #F1F1EF; --ink3: #8F939C; --ink4: #8F939C; --accent: #7C8FF0; --tint: #1D1D20; --mix: #fff; }
  .card { box-sizing: border-box; border-radius: 24px; background: var(--surface); padding: 14px; display: flex; flex-direction: column; }
  .head { display: flex; align-items: baseline; gap: 6px; }
  .day { font-size: 30px; line-height: 1; font-weight: 600; letter-spacing: -.03em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .wd { font-size: 13px; font-weight: 600; color: var(--accent); }
  .sub { margin-left: auto; font-size: 11.5px; font-weight: 600; color: var(--ink4); }
  .rows { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; align-items: center; gap: 8px; border-radius: 10px; padding: 6px 10px 6px 0; }
  .bar { width: 3px; margin: 3px 0 3px 6px; border-radius: 99px; align-self: stretch; flex: none; }
  .name { font-size: 12px; line-height: 1.3; font-weight: 700; letter-spacing: -.01em; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .loc { margin-top: 1px; font-size: 11px; line-height: 1.25; font-weight: 500; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .time { flex: none; font-size: 11.5px; line-height: 1.3; font-weight: 600; color: var(--ink3); font-variant-numeric: tabular-nums; }
  .grow { min-width: 0; flex: 1; }
  .label { font-size: 11.5px; font-weight: 700; color: var(--ink3); }
  .num { font-size: 38px; line-height: 1; font-weight: 600; letter-spacing: -.035em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .unit { font-size: 13px; font-weight: 600; color: var(--ink3); margin-left: 4px; }
  .tm { font-size: 12px; font-weight: 700; color: var(--ink4); }
  .wk { font-size: 17px; font-weight: 600; letter-spacing: -.02em; color: var(--ink); }
  .dt { margin-left: 8px; font-size: 12px; font-weight: 600; color: var(--ink4); }
  .wds { margin-top: 12px; display: flex; gap: 6px; }
  .wds div { flex: 1; text-align: center; font-size: 11.5px; font-weight: 700; color: var(--ink3); }
  .wds .on { color: var(--accent); }
  .grid { margin-top: 8px; display: flex; gap: 6px; }
  .col { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .cell { height: 64px; box-sizing: border-box; border-radius: 10px; padding: 8px 6px; }
  .cell .n { font-size: 11px; line-height: 1.25; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell .t { margin-top: 6px; font-size: 10px; line-height: 1.3; font-weight: 600; color: var(--ink3); font-variant-numeric: tabular-nums; }
  .cell .l { margin-top: 1px; font-size: 10px; line-height: 1.3; font-weight: 500; color: var(--ink4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet { display: flex; gap: 28px; padding: 28px; width: max-content; }
  .col-sheet { display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 32px; }
  .col-sheet.t-light { background: #E9E7E2; }
  .col-sheet.t-dark { background: #2A2C33; }
  .col-sheet.t-black { background: #000; }
  .pair { display: flex; gap: 14px; }
</style>
</head>
<body>
<script>
const C = { math: '#4F5BD5', ds: '#3E9C6E', phy: '#D0873A', eng: '#C25B5B', la: '#7A5BD5' }
const tint = (c, p) => `color-mix(in srgb, ${c} ${p}%, var(--tint))`
const deep = (c, p = 88) => `color-mix(in srgb, ${c} ${p}%, var(--mix))`
const row = (name, loc, time, color, now) => `
  <div class="row" style="background:${tint(color, now ? 30 : 8)}">
    <i class="bar" style="background:${color}"></i>
    <div class="grow"><div class="name"${now ? ` style="color:${deep(color, 72)}"` : ''}>${name}</div>${loc ? `<div class="loc">${loc}</div>` : ''}</div>
    ${time ? `<div class="time">${time}</div>` : ''}
  </div>`
const head = (sub, day = '14', wd = '周二') => `<div class="head"><span class="day">${day}</span><span class="wd">${wd}</span>${sub ? `<span class="sub">${sub}</span>` : ''}</div>`
const empty = (t) => `<div class="label" style="margin-top:10px;font-size:12px">${t}</div>`

const views = {
  today: `<div class="card" style="width:162px;height:162px">
    ${head('还剩 2 节')}
    <div class="rows">${row('高等数学', '教三 302', '10:00', C.math)}${row('数据结构', '教一 201', '14:00', C.ds)}</div>
  </div>`,
  next: `<div class="card" style="width:162px;height:162px">
    <div class="label">下一节</div>
    <div class="head" style="margin-top:4px;gap:0"><span class="num">15</span><span class="unit">分钟后</span></div>
    <div style="margin-top:auto">${row('高等数学（下）', '教三 302　王立群', '', C.math)}</div>
  </div>`,
  twoDays: `<div class="card" style="width:338px;height:162px;flex-direction:row;gap:14px">
    <div class="grow">${head('还剩 2 节')}<div class="rows">${row('高等数学（下）', '', '还剩 35 分', C.math, true)}${row('数据结构', '教一 201', '14:00', C.ds)}</div></div>
    <div class="grow"><div class="tm" style="padding-top:6px">明天 2 节</div><div class="rows">${row('数据结构', '', '10:00', C.ds)}${row('大学物理', '理科楼 A203', '14:00', C.phy)}</div></div>
  </div>`,
  week: (() => {
    const cols = [
      [[C.eng, '大学英语', '08:00', '外语楼 105', false], [C.math, '高等数学', '10:00', '教三 302', false]],
      [[C.eng, '大学英语', '08:00', '外语楼 105', false], [C.math, '高等数学', '10:00', '教三 302', true]],
      [[C.ds, '数据结构', '10:00', '教一 201', false], [C.phy, '大学物理', '14:00', '理科楼 A', false]],
      [[C.math, '高等数学', '08:00', '教三 302', false], [C.la, '线性代数', '14:00', '教三 110', false]],
      [[C.phy, '大学物理', '08:00', '理科楼 A', false], [C.ds, '数据结构', '10:00', '机房 B2', false]],
    ]
    const wd = ['周一', '周二', '周三', '周四', '周五']
    return `<div class="card" style="width:338px;padding:14px 14px 16px">
      <div class="head" style="gap:0"><span class="wk">第 7 周</span><span class="dt">10月14日</span></div>
      <div class="wds">${wd.map((w, i) => `<div class="${i === 1 ? 'on' : ''}">${w}</div>`).join('')}</div>
      <div class="grid">${cols.map((col) => `<div class="col">${col.map(([c, n, t, l, now]) => `
        <div class="cell" style="background:${tint(c, now ? 38 : 8)}">
          <div class="n" style="color:${deep(c, now ? 70 : 88)}">${n}</div><div class="t">${t}</div><div class="l">${l}</div>
        </div>`).join('')}</div>`).join('')}</div>
    </div>`
  })(),
}
const empties = {
  todayDone: `<div class="card" style="width:162px;height:162px">
    ${head('明天 2 节')}
    <div class="rows">${row('数据结构', '教一 201', '10:00', C.ds)}${row('大学物理', '理科楼 A203', '14:00', C.phy)}</div>
  </div>`,
  weekend: `<div class="card" style="width:162px;height:162px">
    ${head('周一 2 节', '18', '周六')}
    <div class="rows">${row('大学英语', '外语楼 105', '08:00', C.eng)}${row('高等数学', '教三 302', '10:00', C.math)}</div>
  </div>`,
  noData: `<div class="card" style="width:162px;height:162px">${head('')}${empty('还没有课表')}</div>`,
  holiday: `<div class="card" style="width:162px;height:162px">${head('', '3', '周三')}${empty('9月8日开学')}</div>`,
  nextDays: `<div class="card" style="width:162px;height:162px">
    <div class="label">周一第一节</div>
    <div class="head" style="margin-top:4px;gap:0"><span class="num">2</span><span class="unit">天后</span></div>
    <div style="margin-top:auto">${row('大学英语', '外语楼 105　李敏', '', C.eng)}</div>
  </div>`,
  nextNone: `<div class="card" style="width:162px;height:162px">
    <div class="label">下一节</div>
    <div class="unit" style="margin:6px 0 0">本学期已结束</div>
  </div>`,
  twoDone: `<div class="card" style="width:338px;height:162px;flex-direction:row;gap:14px">
    <div class="grow">${head('明天 2 节')}<div class="rows">${row('数据结构', '教一 201', '10:00', C.ds)}${row('大学物理', '理科楼 A203', '14:00', C.phy)}</div></div>
    <div class="grow"><div class="tm" style="padding-top:6px">周四 2 节</div><div class="rows">${row('高等数学', '教三 302', '08:00', C.math)}${row('线性代数', '教三 110', '14:00', C.la)}</div></div>
  </div>`,
  twoNone: `<div class="card" style="width:338px;height:162px;flex-direction:row;gap:14px">
    <div class="grow">${head('')}${empty('近两周没有课')}</div><div class="grow"></div>
  </div>`,
  weekNone: `<div class="card" style="width:338px;height:120px;padding:14px 14px 16px">
    <div class="head" style="gap:0"><span class="wk">第 18 周</span><span class="dt">1月12日</span></div>${empty('本学期已结束')}
  </div>`,
}
const q = new URLSearchParams(location.search)
const theme = q.get('theme') || 'light'
if (q.get('sheet') === 'empty') {
  const e = empties
  const col = (t) => `<div class="col-sheet t-${t}"><div class="pair">${e.todayDone}${e.weekend}</div><div class="pair">${e.noData}${e.holiday}</div><div class="pair">${e.nextDays}${e.nextNone}</div>${e.twoDone}${e.twoNone}${e.weekNone}</div>`
  document.body.innerHTML = `<div class="sheet">${col('light')}${col('dark')}</div>`
} else if (q.get('sheet')) {
  const col = (t) => `<div class="col-sheet t-${t}"><div class="pair">${views.today}${views.next}</div>${views.twoDays}${views.week}</div>`
  document.body.innerHTML = `<div class="sheet">${col('light')}${col('dark')}${col('black')}</div>`
} else {
  document.body.className = `t-${theme}`
  document.body.innerHTML = views[q.get('w') || 'today']
}
</script>
</body>
</html>
