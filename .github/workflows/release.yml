name: Release

# tag 推送发版；main 推送只编译不发版，用来预热缓存（Actions 缓存按 ref 隔离，tag 只能读到默认分支的）
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "version=0.0.0" >> $GITHUB_OUTPUT
            echo "versionCode=1" >> $GITHUB_OUTPUT
            echo "versionName=0.0.0-main" >> $GITHUB_OUTPUT
            exit 0
          fi
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Calculate version code from tag (e.g., 1.4.2 -> 10402)
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "versionCode=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "versionName=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Build web
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Name APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist-apk/Timetable-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/Timetable-android.apk

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: v${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.versionCode }}
          REPO: ${{ github.repository }}
        run: |
          APK=dist-apk/Timetable-${TAG#v}.apk
          SIZE=$(stat -c%s "$APK" | awk '{printf "%.1f", $1/1048576}')
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            echo "<a href=\"https://github.com/$REPO/releases/download/$TAG/Timetable-${TAG#v}.apk\"><img src=\"https://raw.githubusercontent.com/$REPO/main/docs/download-android.svg\" alt=\"Download for Android\" /></a>"
            echo
            echo "<details>"
            echo "<summary>APK 信息</summary>"
            echo
            echo "<table>"
            echo "<tr><td>文件</td><td>Timetable-${TAG#v}.apk</td></tr>"
            echo "<tr><td>大小</td><td>${SIZE} MB</td></tr>"
            echo "<tr><td>系统</td><td>Android 7.0+</td></tr>"
            echo "<tr><td>versionCode</td><td>${CODE}</td></tr>"
            echo "<tr><td>SHA-256</td><td><code>${SHA}</code></td></tr>"
            echo "</table>"
            echo "</details>"
            echo
            echo "### 变更"
            echo
            if [ -n "$PREV" ]; then
              git log --format='- %s (%h)' "$PREV..$TAG"
              echo
              echo "**Full Changelog**: [$PREV...$TAG](https://github.com/$REPO/compare/$PREV...$TAG)"
            else
              git log --format='- %s (%h)' "$TAG"
            fi
          } > release-notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-apk/Timetable-${{ steps.version.outputs.version }}.apk
            dist-apk/Timetable-android.apk
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
